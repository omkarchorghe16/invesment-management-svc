apiVersion: apps/v1
kind: Deployment
metadata:
  name: folio-pro-api
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: folio-pro-api
  template:
    metadata:
      labels:
        app: folio-pro-api
    spec:
      containers:
        - name: app
          image: folio-pro-api:REPLACE_WITH_LOCAL_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
          envFrom:
            - secretRef:
                name: folio-pro-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
