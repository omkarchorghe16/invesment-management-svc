apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: folio-pro-api
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - host: dev.folio-pro.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: folio-pro-api
                port:
                  number: 80
